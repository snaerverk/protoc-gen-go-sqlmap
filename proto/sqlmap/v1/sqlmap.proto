syntax = "proto3";

package sqlmap.v1;

import "google/protobuf/descriptor.proto";
import "schema/v1/schema.proto";

message Table {
  string name = 1;
  repeated ForeignKeyDefinition foreign_keys = 2;

  // Marks this table as one arm of a supertype's oneof. Implies the foreign
  // key back, so the key columns must not declare one themselves.
  optional SubtypeOf subtype_of = 3;
}

message Column {
  optional string fieldname = 1;
  optional schema.v1.PK pk = 2;
  map<string, string> type = 3;
  optional ForeignKey foreign_key = 4;

  // Overrides the nullability otherwise derived from the proto field's
  // presence. Unset means: NOT NULL for primary keys and for fields without
  // explicit presence (a proto3 bare scalar), nullable otherwise.
  optional bool nullable = 5;
}

extend google.protobuf.MessageOptions {
  optional Table table = 639000;
}

extend google.protobuf.FieldOptions {
  optional Column col = 639020;
}
message ForeignKeyDefinition {
  repeated string fieldnames = 1;
  ForeignKey to = 2;

  optional schema.v1.OnDelete on_delete = 3;
}

message ForeignKey {
  optional string entity = 1;
  repeated string fieldnames = 2;
}

// Subtypes marks a oneof as a joined-table subtype hierarchy. See
// docs/design/DESIGN-SUBTYPE-TABLES.md.
message Subtypes {
  // Column added to this table recording which subtype each row is.
  string discriminator = 1;

  // Type of the discriminator column per dialect. Defaults to VARCHAR(32).
  map<string, string> type = 2;
}

// SubtypeOf names the supertype a table details.
message SubtypeOf {
  // Supertype message; its oneof must carry the `subtypes` option.
  string entity = 1;

  // Discriminator value for this subtype. Defaults to the oneof field's name.
  optional string value = 2;

  // Columns on THIS table carrying the supertype's key, defaulting to its
  // primary key. The referenced side is always the supertype's primary key,
  // so the counts must match.
  repeated string fieldnames = 3;

  optional schema.v1.OnDelete on_delete = 4;
}

extend google.protobuf.OneofOptions {
  optional Subtypes subtypes = 639040;
}
