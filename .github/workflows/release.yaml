name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  contents: write
jobs:
  setup:
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
      # buf-setup-action is deprecated in favor of the unified buf-action.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: make install
      - run: go test ./...
  release:
    runs-on: ["ubuntu-latest"]
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-push-action@v1
        with:
          buf_token: ${{ secrets.BUF_TOKEN }}
      # actions/create-release is archived; the gh CLI is preinstalled on the
      # runner and needs no third-party action.
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The BSR remote plugin, so consumers can use `remote: buf.build/snaerverk/
  # go-sqlmap` instead of installing the binary. Runs after `release` because
  # buf.plugin.yaml's license_url points at the tag's LICENSE.
  plugin:
    runs-on: ["ubuntu-latest"]
    needs: release
    steps:
      - uses: actions/checkout@v4
      # setup_only + token performs a real BSR login (unlike the deprecated
      # buf-setup-action, which only installs the binary) — the bare
      # `env: BUF_TOKEN` previously on the push step below authenticated
      # fine for stable commands but not for this beta one.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.BUF_TOKEN }}
      # buf.plugin.yaml pins the runtime module the generated code imports.
      # Publishing it out of step with the tag would ship a plugin whose
      # generated SDKs require a module version that does not exist.
      - name: Check buf.plugin.yaml is in step with the tag
        run: |
          pinned=$(awk '/^plugin_version:/ {print $2}' buf.plugin.yaml)
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "::error::buf.plugin.yaml plugin_version is $pinned, tag is $GITHUB_REF_NAME"
            exit 1
          fi
          if ! grep -q "version: $GITHUB_REF_NAME\$" buf.plugin.yaml; then
            echo "::error::buf.plugin.yaml does not pin the runtime module at $GITHUB_REF_NAME"
            exit 1
          fi
      # `buf beta registry plugin push` only accepts an already-built local
      # Docker image via --image; it does not build the Dockerfile itself.
      - name: Build the plugin image
        run: docker build --platform linux/amd64 -t buf.build/snaerverk/go-sqlmap:$GITHUB_REF_NAME .
      - name: Push the remote plugin
        run: buf beta registry plugin push --visibility=public --image=buf.build/snaerverk/go-sqlmap:$GITHUB_REF_NAME
  builds:
    runs-on: ["ubuntu-latest"]
    needs: release
    strategy:
      matrix:
        GOARCH: ["386", "amd64"]
        GOOS: ["linux", "windows"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -o protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }} ./cmd/protoc-gen-go-sqlmap/
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          tag: ${{ github.ref }}
          asset_name: protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          overwrite: false
          prerelease: false
